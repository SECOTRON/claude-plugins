name: Sync Fork

# Keeps the personal showcase fork (thomasgeens/claude-plugins) up to date with
# the canonical SECOTRON/claude-plugins. The job is guarded to the fork, so it is
# a harmless no-op in the upstream repo.

on:
  schedule:
    - cron: 0 6 * * 1 # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    if: github.repository == 'thomasgeens/claude-plugins'
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync thomasgeens/claude-plugins --branch main
